services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xbd
      POSTGRES_PASSWORD: xbd_dev_password
      POSTGRES_DB: xbd
    ports:
      - "5432:5432"
    volumes:
      - xbd_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xbd -d xbd"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ./server
    environment:
      HTTP_ADDR: :8080
      POSTGRES_URL: postgres://xbd:xbd_dev_password@postgres:5432/xbd?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      WECHAT_APP_ID: ${WECHAT_APP_ID:-replace_me}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-replace_me}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-replace_me}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-replace_me}
      # 本地 HTTP 才关闭安全 Cookie；正式 HTTPS 部署应设为 true。
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-}
      ADMIN_TRUSTED_PROXY_CIDRS: ${ADMIN_TRUSTED_PROXY_CIDRS:-}
      DEVELOPMENT_ROOMS: ${DEVELOPMENT_ROOMS:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-web:
    build:
      context: ./admin-web
      target: development
    environment:
      # 浏览器访问同源 /api；代理在容器内访问后端。
      VITE_API_PROXY_TARGET: http://server:8080
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  xbd_postgres:
