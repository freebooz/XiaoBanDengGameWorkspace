<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>小板凳麻将界面效果图</title>
  <style>
    :root {
      color: #26372c;
      background: #f4f2e9;
      font: 16px/1.6 system-ui, "Microsoft YaHei UI", "PingFang SC", sans-serif;
      --jade: #285544;
      --muted: #5f6b61;
      --line: #d8ddd0;
      --card: #fffef8;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    header, main {
      width: min(calc(100% - 2rem), 94rem);
      margin-inline: auto;
    }

    header {
      padding-block: clamp(2rem, 5vw, 4rem) 1.5rem;
      border-bottom: 1px solid var(--line);
    }

    h1, h2, p, figure { margin: 0; }

    h1 { font-size: clamp(1.75rem, 4vw, 3.25rem); line-height: 1.2; }
    h2 { font-size: clamp(1.3rem, 2vw, 1.85rem); }

    header p, .note {
      margin-block-start: .55rem;
      color: var(--muted);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-block-start: 1.3rem;
    }

    nav a {
      color: var(--jade);
      padding: .3rem .75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      text-decoration: none;
    }

    main { padding-block-end: 3rem; }

    section { margin-block-start: clamp(1.75rem, 4vw, 3rem); }

    .views {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
      gap: 1rem;
      padding: 0;
      margin: .8rem 0 0;
      list-style: none;
    }

    .view {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: .8rem;
      overflow: hidden;
      background: var(--card);
    }

    .view a {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: .18rem solid var(--jade);
      outline-offset: .15rem;
    }

    .view a:focus-visible { outline-offset: -.22rem; }

    nav a:hover, .view:hover figcaption { background: #e7eee4; }

    .preview {
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 10;
      min-width: 0;
      overflow: hidden;
      background: #e7eae1;
    }

    .preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    figcaption {
      display: flex;
      align-items: baseline;
      gap: .7rem;
      padding: .65rem .85rem;
      font-weight: 600;
    }

    .number {
      color: var(--jade);
      font-size: .88em;
      font-variant-numeric: tabular-nums;
    }

    @media (min-width: 69rem) {
      .views { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>
