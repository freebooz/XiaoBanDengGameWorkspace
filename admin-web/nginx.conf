server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=5s;
    set $platform_api http://server:8080;

    location = /api/v1/admin/monitor/stream {
        proxy_pass $platform_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    location /api/ {
        proxy_pass $platform_api;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass $platform_api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
