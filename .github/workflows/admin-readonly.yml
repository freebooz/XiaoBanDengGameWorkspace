# 一期只读后台的隔离服务验证；测试数据只进入临时服务。
name: 只读管理后台回归
on:
  pull_request:
  push:
    branches: [main, feat/admin-readonly-centers-20261009]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xbd_test
          POSTGRES_PASSWORD: regression_only_password
          POSTGRES_DB: xbd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xbd_test -d xbd_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      # 环境变量显式开启真实依赖测试；默认本地测试不会误连开发或生产库。
      - name: Go 真实服务及竞态回归
        working-directory: server
        env:
          TEST_POSTGRES_URL: postgres://xbd_test:regression_only_password@localhost:5432/xbd_test?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
          XBD_TEST_POSTGRES_DSN: postgres://xbd_test:regression_only_password@localhost:5432/xbd_test?sslmode=disable
        run: go test -race -count=1 ./...
      - name: 前端回归与构建
        working-directory: admin-web
        run: |
          npm ci
          npm test -- --run
          npm run build
      # 两种前端镜像都构建，正式镜像额外执行 Nginx 配置校验。
      - name: Docker 与 Nginx 验证
        run: |
          docker build -t xbd-server-check server
          docker build --target development -t xbd-admin-dev-check admin-web
          docker build --target production -t xbd-admin-check admin-web
          docker run --rm --add-host server:127.0.0.1 xbd-admin-check nginx -t
          docker compose config --quiet
      # 实际生产镜像通过 Nginx 同源代理执行真实 Cookie / WebSocket / 数据库链路。
      - name: 生产镜像浏览器烟测
        env:
          TEST_ADMIN_BASE_URL: http://127.0.0.1
          TEST_ADMIN_USERNAME: regression-operator
          TEST_ADMIN_PASSWORD: browser-test-only-password
          TEST_REPORT_PATH: /tmp/admin-browser-results.json
        run: |
          npx --prefix admin-web playwright install --with-deps chromium
          test_hash=$(printf '%s\n' "$TEST_ADMIN_PASSWORD" | (cd server && go run ./cmd/admin-password))
          docker run -d --name xbd-api-smoke --network host -e HTTP_ADDR=:8080 -e POSTGRES_URL='postgres://xbd_test:regression_only_password@localhost:5432/xbd_test?sslmode=disable' -e REDIS_ADDR=localhost:6379 -e ADMIN_USERNAME="$TEST_ADMIN_USERNAME" -e ADMIN_PASSWORD_HASH="$test_hash" -e ADMIN_COOKIE_SECURE=false -e ADMIN_TRUSTED_PROXY_CIDRS=127.0.0.1/32 -e DEVELOPMENT_ROOMS=true xbd-server-check
          docker run -d --name xbd-admin-smoke --network host --add-host server:127.0.0.1 xbd-admin-check
          for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1/api/v1/catalog >/dev/null && break; sleep 1; done
          node admin-web/scripts/readonly-smoke.mjs
      - name: 上传浏览器回归结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-results
          path: /tmp/admin-browser-results.json
          if-no-files-found: ignore
      - name: 测试服务日志
        if: failure()
        run: |
          docker logs xbd-api-smoke || true
          docker logs xbd-admin-smoke || true
