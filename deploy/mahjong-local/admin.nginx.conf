server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/mahjong-tls/server.crt;
    ssl_certificate_key /etc/nginx/mahjong-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=5s;
    set $mahjong_api http://api:8080;
    access_log off;

    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

    location = /api/v1/admin/monitor/stream {
        proxy_pass $mahjong_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
    }

    location ^~ /api/v1/admin/ {
        proxy_pass $mahjong_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
    }

    location = /health { proxy_pass $mahjong_api/health; }
    location = /api/v1/catalog { proxy_pass $mahjong_api; }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
