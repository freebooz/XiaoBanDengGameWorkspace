services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xbd
      POSTGRES_PASSWORD: ${XBD_MAHJONG_POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: xbd
    volumes:
      - mahjong_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U xbd -d xbd']
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build:
      context: ../../server
    environment:
      HTTP_ADDR: :8080
      POSTGRES_URL: postgres://xbd:${XBD_MAHJONG_POSTGRES_PASSWORD:?Set a local database password}@postgres:5432/xbd?sslmode=disable
      REDIS_ADDR: redis:6379
      XBD_MAHJONG_SINGLE_WRITER: '1'
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, 'http://127.0.0.1:8080/health']
      interval: 2s
      timeout: 3s
      retries: 20

  edge:
    image: nginx:alpine
    ports:
      - '127.0.0.1:${XBD_MAHJONG_TLS_PORT:-0}:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ready.json:/usr/share/nginx/html/mahjong-ready.json:ro
      - ${XBD_MAHJONG_TLS_DIR:?Set a directory with server.crt and server.key}:/etc/nginx/mahjong-tls:ro
    networks: [data, edge]
    depends_on:
      api:
        condition: service_healthy

networks:
  data:
    internal: true
  edge:

volumes:
  mahjong_data:
