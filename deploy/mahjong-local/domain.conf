server {
    listen 443 ssl;
    server_name api.xbd.freeboozstudio.test;
    ssl_certificate /etc/nginx/xbd-domain/server.crt;
    ssl_certificate_key /etc/nginx/xbd-domain/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 ipv6=off valid=5s;
    set $xbd_domain_api http://api:8080;
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;

    location = /health {
        auth_request /xbd-domain-internal-readiness;
        error_page 500 =503 /xbd-domain-not-ready;
        alias /usr/share/nginx/html/mahjong-ready.json;
        default_type application/json;
        add_header Cache-Control no-store always;
    }

    location = /xbd-domain-internal-readiness {
        internal;
        proxy_pass $xbd_domain_api/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location = /xbd-domain-not-ready {
        internal;
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"status":"unavailable"}';
    }

    location ~ ^/(api/v1/mahjong/ws|ws)$ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mahjong_connection;
        proxy_read_timeout 3600s;
        proxy_pass $xbd_domain_api;
    }

    location ~ ^/api/v1/(catalog|wallet|auth/(guest|register|login|session|logout|delete-request)|matchmaking/(quick|ready|cancel)|mahjong/history(/[A-Za-z0-9-]+(/replay)?)?)$ {
        proxy_pass $xbd_domain_api;
    }

    location / { return 404; }
}
